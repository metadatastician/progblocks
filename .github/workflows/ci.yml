# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.

{
  name: "CI",
  on: {
    push: {
      branches: [
        "main",
      ],
    },
    pull_request: {
      branches: [
        "main",
      ],
    },
  },
  # Read-only default for every job (Scorecard TokenPermissions); each job
  # also declares its own.
  permissions: {
    contents: "read",
  },
  jobs: {
    build: {
      runs-on: "ubuntu-latest",
      steps: [
        {
          uses: "actions/checkout@v7.0.1",
        },
        {
          name: "Set up Bun",
          uses: "oven-sh/setup-bun@v2.2.0",
          with: {
            bun-version: "1.3.14",
          },
        },
        {
          name: "Install dev dependencies",
          run: "bun install --frozen-lockfile",
        },
        {
          name: "Test Component",
          run: "bun run test",
        },
        # axe-core (WCAG 2.0-2.2 A/AA + best practice) against index.html in the
        # runner's preinstalled Google Chrome; exits non-zero on any violation
        # or item needing review. No third-party action, so no new pin.
        # Every tracked .json file must be RFC 8785 (JCS) canonical and RFC 7493
        # I-JSON. Fix locally with: bun tools/jcs.mjs fix $(git ls-files '*.json')
        {
          name: "JSON is JCS canonical",
          run: "bun tools/jcs.mjs check $(git ls-files '*.json')",
        },
        {
          name: "Accessibility audit",
          run: "CHROMIUM_PATH=\"$(command -v google-chrome)\" bun tools/a11y-audit.mjs",
        },
      ],
      permissions: {
        contents: "read",
      },
    },
    pins: {
      name: "action pins resolve",
      runs-on: "ubuntu-latest",
      timeout-minutes: 5,
      permissions: {
        contents: "read",
      },
      steps: [
        {
          uses: "actions/checkout@v7.0.1",
        },
        # Added after #39: this repository has now lost two ways to a pin that
        # names no commit — #9 (codeql-action) and #36 (the Scorecard reusable,
        # pinned to a BLOB id) — and CodeQL spent #34..#38 in startup_failure
        # because uses: drifted from actions.lock. Actions resolves a uses: ref
        # only at run time, and an unresolvable ref produces no check run at
        # all, so the failure is invisible on the PR unless it is caught here.
        # Modelled on metadatastician/berrywiki#60, plus a lockfile integrity
        # check for this repository's tag-ref + lockfile pinning form.
        {
          name: "Every SHA pin resolves; every lockfile entry dereferences to its commit",
          env: {
            GH_TOKEN: "${{ github.token }}",
          },
          run: "bash tools/check-action-pins.sh",
        },
      ],
    },
  },
}
